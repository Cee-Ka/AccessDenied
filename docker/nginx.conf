server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        font/woff2;

    include /etc/nginx/conf.d/security-headers.snippet;

    location = /healthz {
        access_log off;
        default_type text/plain;
        include /etc/nginx/conf.d/security-headers.snippet;
        return 200 "ok\n";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/conf.d/security-headers.snippet;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
